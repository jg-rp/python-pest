[project]
name = "python-pest"
version = "0.1.1"
description = "A general purpose parser written in Python."
readme = "README.md"
authors = [{ name = "James Prior", email = "jamesgr.prior@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "regex>=2025.7.34",
]

[project.urls]
Documentation = "https://jg-rp.github.io/python-pest/"
Issues = "https://github.com/jg-rp/python-pest/issues"
Source = "https://github.com/jg-rp/python-pest"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "click==8.2.1",
    "mkdocs-material>=9.6.21",
    "mkdocstrings[python]>=0.30.1",
    "pyrefly>=1.5.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.10",
    "types-regex>=2025.7.34.20250809",
]


[tool.uv.build-backend]
module-root = "src"
module-name = "pest"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "examples/**/parser.py",
]

target-version = "py312"

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "BLE",
  "C4",
  "E",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PIE",
  "PL",
  "PT",
  "Q",
  "RET",
  "RSE",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TCH",
  "TID",
  "YTT",
]

ignore = [
  "ARG002",
  "S105",
  "S101",
  "D107",
  "D105",
  "PLR0913",
  "SIM108",
  "PT001",
  "A005",
  "PLW1641",
  "PLR1730",
  "PLR2004",
  "PLR0917",
]

fixable = ["I"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/jsonpath/jsonpath.py" = ["PLR0911"]
"examples/jsonpath/unescape.py" = ["PLR2004"]
"examples/**/*" = ["Q000", "A001", "T201", "E501"]
"benchmarks/*" = ["T201"]

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.12.0"
preset = "strict"
check-unannotated-defs = true
infer-return-types = "never"

[tool.pyrefly.errors]
missing-override-decorator = false
